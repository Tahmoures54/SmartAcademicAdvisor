name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffold
        run: flutter create --platforms=android .
      - name: Configure stable Android package and Persian app label
        run: python scripts/configure_android_release.py
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK using the server-side advisor proxy
        env:
          ADVISOR_API_BASE_URL: ${{ vars.ADVISOR_API_BASE_URL }}
        run: |
          flutter build apk --debug \
            --dart-define=ADVISOR_API_BASE_URL="$ADVISOR_API_BASE_URL"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-academic-advisor-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Create temporary CI-only Android signing key
        run: |
          set -euo pipefail
          mkdir -p android/app
          keytool -genkeypair -noprompt -keystore "$GITHUB_WORKSPACE/android/app/release-keystore.jks" \
            -storepass ci-only-password -keypass ci-only-password -alias ci-validation \
            -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI Validation"
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/release-keystore.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=ci-only-password" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=ci-validation" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=ci-only-password" >> "$GITHUB_ENV"

      - name: Build signed release using temporary CI key
        env:
          ADVISOR_API_BASE_URL: ${{ vars.ADVISOR_API_BASE_URL }}
        run: |
          flutter build apk --release \
            --dart-define=ADVISOR_API_BASE_URL="$ADVISOR_API_BASE_URL"

      - name: Verify temporary release APK signature
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Remove temporary CI signing material
        if: always()
        run: rm -f android/app/release-keystore.jks

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Test backend API
        run: python -m unittest -v test_app.py
      - name: Build backend Docker image
        working-directory: .
        run: docker build --file backend/Dockerfile --tag smart-academic-advisor-api:${{ github.sha }} .
