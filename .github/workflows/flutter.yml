name: Flutter Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'

jobs:
  flutter-quality:
    name: Flutter · Analyze and Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold when absent
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Ensure no compile-time provider secrets
        run: |
          if grep -R -nE "String.fromEnvironment\(['\"]AI_API_KEY|--dart-define=AI_API_KEY" lib .github/workflows; then
            echo "::error::Provider API keys must never be compiled into the APK."
            exit 1
          fi

      - name: Static analysis
        run: flutter analyze --no-pub

      - name: Unit and widget tests
        run: flutter test --no-pub --reporter expanded

  android-debug:
    name: Android · Build debug APK
    runs-on: ubuntu-latest
    needs: flutter-quality
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold when absent
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      - name: Configure application identity
        run: python scripts/configure_android_release.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: smart-academic-advisor-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
