name: Flutter & Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# لغو اجراهای قبلی روی همان ref تا منابع هدر نروند
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  # برای reproducible build می‌توانید مقدار نسخه را ثابت کنید، مثلاً: '3.27.4'
  # FLUTTER_VERSION: '3.27.4'
  JAVA_VERSION: '17'
  PYTHON_VERSION: '3.12'

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1) کیفیت کد Flutter: format + analyze + test
  # ─────────────────────────────────────────────────────────────
  flutter-quality:
    name: Flutter · Format, Analyze, Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter (${{ env.FLUTTER_CHANNEL }})
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          # flutter-version: ${{ env.FLUTTER_VERSION }}   # در صورت فعال‌سازی نسخه ثابت
          cache: true

      - name: Flutter doctor (debug info)
        run: flutter doctor -v

      - name: Ensure Android platform scaffold
        run: |
          if [ ! -d "android" ]; then
            echo "::notice::android/ missing — generating Flutter Android scaffold"
            flutter create --platforms=android .
          else
            echo "::notice::android/ already present — skipping scaffold generation"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting (lib/ — advisory until formatter commit)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib

      - name: Verify formatting (test/ — advisory until formatter commit)
        continue-on-error: true
        run: |
          if [ -d "test" ]; then
            dart format --output=none --set-exit-if-changed test
          else
            echo "::notice::test/ not found — skipping format check"
          fi

      - name: Ensure no provider credentials are embedded in Flutter sources or APK build
        run: |
          if grep -R -nE 'AI_API_KEY|AI_BASE_URL|AI_MODEL' lib; then
            echo "::error::Provider credentials/configuration must remain server-side."
            exit 1
          fi
          if grep -nE 'AI_API_KEY|AI_BASE_URL|AI_MODEL' .github/workflows/flutter.yml; then
            echo "::error::The Android build workflow must not inject provider credentials."
            exit 1
          fi

      - name: Analyze
        # برای سخت‌گیری بیشتر: --fatal-warnings --fatal-infos را اضافه کنید
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub --reporter expanded

  # ─────────────────────────────────────────────────────────────
  # 2) بیلد APK دیباگ (فقط پس از موفقیت کیفیت کد)
  # ─────────────────────────────────────────────────────────────
  flutter-build-android:
    name: Flutter · Build debug APK
    runs-on: ubuntu-latest
    needs: flutter-quality
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter (${{ env.FLUTTER_CHANNEL }})
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Ensure Android platform scaffold
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Configure stable Android package and Persian app label
        run: python scripts/configure_android_release.py

      - name: Install dependencies
        run: flutter pub get

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK using the server-side advisor proxy
        env:
          ADVISOR_API_BASE_URL: ${{ vars.ADVISOR_API_BASE_URL }}
        run: |
          flutter build apk --debug --no-pub \
            --dart-define=ADVISOR_API_BASE_URL="${ADVISOR_API_BASE_URL:-}"

      - name: Upload debug APK (push / manual only)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: smart-academic-advisor-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # 3) بک‌اند: lint + format-check + compile + test with coverage
  # ─────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend · Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff coverage

      - name: Compile check
        run: python -m compileall -q .

      - name: Lint (Ruff)
        run: ruff check .

      - name: Format check (Ruff — advisory)
        # در اولین اجرا ممکن است هشدار بدهد؛ یک‌بار `ruff format .` را لوکال اجرا و commit کنید.
        continue-on-error: true
        run: ruff format --check .

      - name: Test with coverage
        run: |
          coverage run -m unittest -v test_app.py
          coverage report --skip-covered

      - name: Build backend Docker image
        working-directory: .
        run: docker build --file backend/Dockerfile --tag smart-academic-advisor-api:${{ github.sha }} .
