# Render Blueprint for a low-cost staging deployment.
# Free instances are for testing only; see backend/README.md before public use.
services:
  - type: web
    name: smart-academic-advisor-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: hardening/stage-1-ci-and-release-audit
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.deepseek.com
      - key: AI_MODEL
        value: deepseek-chat
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: MAX_REQUESTS_PER_MINUTE
        value: "10"
      - key: MAX_REQUESTS_PER_DAY
        value: "50"
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "30"
